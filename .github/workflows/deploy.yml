name: Deploy to GitHub Pages

on:
  # STILLGELEGT am 29.08.2026. Die Seite laeuft seitdem ueber Cloudflare
  # Workers, das Deployment nach GitHub Pages ist damit ueberfluessig und
  # wuerde nur bei jedem Push unnoetig bauen.
  #
  # Der Workflow bleibt bewusst erhalten und laesst sich in der
  # Actions-Oberflaeche von Hand starten ("Run workflow"). Er ist die
  # Rueckfallebene, falls die Seite kurzfristig wieder ueber GitHub Pages
  # laufen soll. Dafuer muss zusaetzlich public/CNAME wieder angelegt
  # werden (Inhalt: planbstudios.de) und das DNS gemaess
  # DNS-RUECKFALLEBENE.md zurueckgestellt werden.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
