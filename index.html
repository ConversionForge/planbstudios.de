    <!-- Strukturierte Daten: Ortsgebundenes Unternehmen. Gibt Suchmaschinen die
         Angaben maschinenlesbar, die sonst nur als Fliesstext im Impressum
         stehen. Wichtig fuer die lokale Suche und fuer den Eintrag in Karten.

         Der Hash dieses Blocks wird von scripts/postbuild.mjs automatisch in die
         Content-Security-Policy aufgenommen, damit er nicht blockiert wird. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://planbstudios.de/#studio",
        "name": "Plan B Studios",
        "description": "Webdesign und begehbare 3D-Rundgänge für Immobilien. Maßgeschneiderte Websites für Makler, Hausverwaltungen und Bauträger.",
        "url": "https://planbstudios.de/",
        "image": "https://planbstudios.de/og-image.png",
        "logo": "https://planbstudios.de/og-image.png",
        "email": "info@planbstudios.de",
        "telephone": "+49-178-8489408",
        "founder": { "@type": "Person", "name": "Bilal Gnielka" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Robert-Koch-Straße 24",
          "postalCode": "23562",
          "addressLocality": "Lübeck",
          "addressRegion": "Schleswig-Holstein",
          "addressCountry": "DE"
        },
        "areaServed": [
          { "@type": "City", "name": "Lübeck" },
          { "@type": "State", "name": "Schleswig-Holstein" }
        ],
        "knowsLanguage": ["de", "en"],
        "priceRange": "$$",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Leistungen",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Webdesign für Immobilien",
                "description": "Maßgeschneiderte Websites für Makler, Hausverwaltungen und Bauträger, ohne Baukasten und ohne Vorlage."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "3D-Rundgänge für Immobilien",
                "description": "Begehbare 3D-Rundgänge und cinematische Objektfilme, die aus Exposés Besichtigungen machen."
              }
            }
          ]
        }
      }
    </script>
